name = "FSharp"
code_fence_block_name = "fsharp"
grammar = "fsharp"
path_suffixes = ["fs", "fsx", "fsi", "fsscript"]
line_comments = ["// ", "/// "]
block_comment = ["(* ", " *)"]
autoclose_before = ";:.,=}])>"
brackets = [
    # Compound openers extend an already auto-closed single-character pair.
    # Enabling close here would insert a second closing delimiter.
    { start = "{|", end = "|}", close = false, newline = true, not_in = ["string", "comment"] },
    { start = "[|", end = "|]", close = false, newline = true, not_in = ["string", "comment"] },
    { start = "[<", end = ">]", close = false, newline = false, not_in = ["string", "comment"] },
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    # Apostrophes also begin generic parameters and occur in identifiers.
    { start = "'", end = "'", close = false, newline = false, not_in = ["string", "comment"] },
]
